<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WorkSetu</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4F46E5', surface: '#F8FAFC' },
                    fontFamily: { display: ['Sora','sans-serif'], body: ['DM Sans','sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1,h2,h3 { font-family: 'Sora', sans-serif; }
        /* Dark admin theme */
        .admin-bg {
            background: linear-gradient(135deg, #1E1B4B 0%, #312E81 40%, #4C1D95 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .input-dark {
            width: 100%; padding: 0.75rem 1rem;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 0.75rem; outline: none; transition: all 0.2s;
            background: rgba(255,255,255,0.08);
            color: white; font-size: 0.9rem;
        }
        .input-dark::placeholder { color: rgba(255,255,255,0.4); }
        .input-dark:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(255,255,255,0.1); }
    </style>
</head>
<!-- UI UPGRADED: Dark glass morphism admin login with deep indigo theme -->
<body class="admin-bg flex items-center justify-center p-4">

    <!-- Decorative circles -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/4 pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-64 h-64 bg-purple-500/10 rounded-full translate-y-1/2 -translate-x-1/4 pointer-events-none"></div>

    <div class="w-full max-w-sm relative z-10">
        <!-- Back link -->
        <a href="../index.html" class="inline-flex items-center gap-2 text-white/60 hover:text-white/90 text-sm mb-6 transition-colors">
            <i class="fas fa-arrow-left text-xs"></i> Back to Home
        </a>

        <!-- Glass Card -->
        <div class="glass-card rounded-3xl overflow-hidden">

            <!-- Header -->
            <div class="p-7 pb-5">
                <div class="w-14 h-14 bg-white/15 rounded-2xl flex items-center justify-center mb-5 backdrop-blur-sm border border-white/20">
                    <i class="fas fa-shield-alt text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1">Admin Login</h1>
                <p class="text-white/60 text-sm">WorkSetu Platform Administration</p>
            </div>

            <!-- Warning Banner -->
            <div class="mx-6 mb-6 bg-amber-500/15 border border-amber-400/30 rounded-xl p-3.5 flex gap-3 items-start">
                <i class="fas fa-exclamation-triangle text-amber-300 mt-0.5 flex-shrink-0 text-sm"></i>
                <div>
                    <p class="text-amber-300 font-semibold text-sm">Authorized Access Only</p>
                    <p class="text-amber-200/80 text-xs mt-0.5">This login is restricted to administrators only.</p>
                </div>
            </div>

            <!-- Form -->
            <div class="px-7 pb-7">
                <!-- Admin login form (ID unchanged) -->
                <form id="admin-login-form" class="space-y-5">
                    <!-- Email -->
                    <div>
                        <label class="block text-white/80 text-sm font-semibold mb-2">Admin Email</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/40">
                                <i class="fas fa-envelope text-sm"></i>
                            </span>
                            <input
                                type="email"
                                id="admin-email"
                                placeholder="admin@worksetu.com"
                                class="input-dark pl-10"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-white/80 text-sm font-semibold mb-2">Admin Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/40">
                                <i class="fas fa-lock text-sm"></i>
                            </span>
                            <input
                                type="password"
                                id="admin-password"
                                placeholder="Enter admin password"
                                class="input-dark pl-10 pr-12"
                                required
                            >
                            <button type="button" id="toggle-password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/70 transition-colors">
                                <i class="fas fa-eye text-sm" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-3.5 rounded-xl font-bold hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 shadow-lg hover:shadow-xl hover:scale-[1.01] flex items-center justify-center gap-2 mt-2"
                    >
                        <i class="fas fa-sign-in-alt"></i>
                        Login as Admin
                    </button>
                </form>

                <!-- Info -->
                <div class="mt-6 text-center">
                    <p class="text-white/40 text-xs">
                        <i class="fas fa-info-circle mr-1"></i>
                        Only authorized administrators can access this portal.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript (UNCHANGED) -->
    <script type="module">
        import { loginUser, getUserData } from '../js/auth.js';

        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('admin-password');
            const eyeIcon = document.getElementById('eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!email || !email.includes('@')) {
                alert('❌ Please enter a valid admin email address');
                return;
            }

            if (!password || password.length < 6) {
                alert('❌ Please enter a valid password (minimum 6 characters)');
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Verifying...';
            submitBtn.disabled = true;

            try {
                const result = await loginUser(email, password);

                if (!result.success) {
                    alert('❌ Login failed: ' + result.error);
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                let userData = result.userData;

                if (!userData || Object.keys(userData).length === 0) {
                    alert('Creating admin profile...');

                    const { db, doc, setDoc } = await import('../js/firebase-config.js');

                    const userRef = doc(db, 'users', result.user.uid);
                    const adminData = {
                        uid: result.user.uid,
                        email: email,
                        fullName: 'Administrator',
                        userType: 'admin',
                        isAdmin: true,
                        trustScore: 100,
                        isActive: true,
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(userRef, adminData);
                    userData = adminData;

                    alert('✅ Admin profile created successfully!');
                }

                if (!userData.isAdmin) {
                    alert('⛔ Access Denied!\n\nYou do not have administrator privileges.\n\nThis login is for administrators only.');

                    const { logoutUser } = await import('../js/auth.js');
                    await logoutUser();

                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                alert('✅ Admin login successful!\n\nWelcome, ' + (userData.fullName || 'Administrator'));
                window.location.href = 'admin-dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                alert('❌ An error occurred during login. Please try again.');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
